{% extends "base.html" %}

{% block title %}QR-код недоступен - Confiq{% endblock %}

{% block content %}
<div class="content-container">
    <div class="md-card">
        <div class="md-card-header">
            <div class="md-card-title">QR-код недоступен</div>
        </div>
        <div class="md-card-body">
            <p>{{ reason }}</p>
            <a href="{{ url_for('user.download_config', config_id=config.id) }}" class="md-btn md-btn-filled">
                <span class="material-icons-round">download</span>
                Скачать конфигурацию
            </a>
            <a href="{{ url_for('user.view_config', config_id=config.id) }}" class="md-btn md-btn-text">
                Вернуться к конфигурации
            </a>
        </div>
    </div>
</div>
{% endblock %}
